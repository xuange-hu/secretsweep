name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no dependencies expected)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Zero runtime dependencies
        run: |
          python -c "import secretsweep, secretsweep.cli, secretsweep.mcp_server; print('imports ok without extras')"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: CLI smoke
        run: |
          secretsweep rules | head -5
          secretsweep entropy "qN3xT7vLm2pR9wZ4cK8jH5fB1dY6sA0eU3oI7gXz"  # secretsweep:ignore
          secretsweep demo --dir /tmp/secretsweep-demo | tail -20

      - name: Dogfood - secretsweep must pass its own gate
        run: secretsweep scan . --fail-on high

      - name: Badge count matches pytest collection (warning only)
        run: |
          collected=$(python -m pytest --collect-only -q -o addopts="" 2>/dev/null | grep -c "::")
          badge=$(grep -oE 'tests-[0-9]+' README.md | head -1 | grep -oE '[0-9]+')
          echo "collected=$collected badge=$badge"
          if [ -n "$badge" ] && [ "$collected" != "$badge" ]; then
            echo "::warning::README badge says $badge but pytest collects $collected"
          fi

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install with the mcp extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mcp]' pytest
      - name: MCP server builds and registers tools
        run: |
          python - <<'PY'
          import asyncio

          from secretsweep.mcp_server import create_server, tool_manifest

          server = create_server()
          tools = asyncio.run(server.list_tools())
          names = {t.name for t in tools}
          expected = {t["name"] for t in tool_manifest()}
          assert names == expected, (names, expected)
          print("MCP tools:", sorted(names))
          PY
